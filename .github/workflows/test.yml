name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run E2E tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Run E2E tests
        if: runner.os != 'Linux'
        run: npm test
